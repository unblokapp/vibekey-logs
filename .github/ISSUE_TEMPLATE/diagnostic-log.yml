name: Diagnostic log
description: Report a bug with a redacted log from the app
title: "[log] "
labels:
  - diagnostic
body:
  - type: markdown
    attributes:
      value: |
        Attach the **redacted** log file from **Settings → About → Save log → Share redacted log**.
        Do not paste an unredacted Save file.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open WhatsApp\n2. Tap Assist → Fix grammar\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version (from log header)
      placeholder: "4.5.856 (5216)"
  - type: input
    id: device
    attributes:
      label: Device (from log header)
      placeholder: "Google Pixel 8"
  - type: textarea
    id: log
    attributes:
      label: Log file
      description: Drag and drop the redacted .txt file here, or paste a link if uploaded elsewhere
    validations:
      required: false
